name: Release

# Run by hand: Actions > Release > Run workflow.
#
# It builds the .3dsx, .smdh and .cia, and publishes them as a GitHub
# release. Nothing is published unless you start it.
#
# The release is named after the version in the Makefile
# (VERSION_MAJOR.VERSION_MINOR.VERSION_MICRO, for example 1.0.4), and
# its text is the section of CHANGELOG.md with the same version
# (for example "### v1.04"), copied exactly as it is written there.
#
# To make a new release:
#   1. Raise VERSION_MICRO (or the others) in the Makefile.
#   2. Add the "### vX.YZ" section to the top of CHANGELOG.md.
#   3. Commit and push, then run this workflow.

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the release as a draft, to review it before it is published"
        type: boolean
        default: false

# Needed to create the tag and the release.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # The tag is MAJOR.MINOR.MICRO (1.0.4). The changelog heading is
      # "v" + MAJOR + "." + MINOR + MICRO (v1.04), like the version that
      # the emulator shows.
      - name: Read the version from the Makefile
        id: version
        run: |
          read_number() {
            sed -n "s/^$1[[:space:]]*:=[[:space:]]*\([0-9][0-9]*\).*/\1/p" Makefile | head -n 1
          }
          major=$(read_number VERSION_MAJOR)
          minor=$(read_number VERSION_MINOR)
          micro=$(read_number VERSION_MICRO)
          if [ -z "$major" ] || [ -z "$minor" ] || [ -z "$micro" ]; then
            echo "::error::Could not read VERSION_MAJOR, VERSION_MINOR and VERSION_MICRO from the Makefile."
            exit 1
          fi
          echo "tag=$major.$minor.$micro" >> "$GITHUB_OUTPUT"
          echo "heading=v$major.$minor$micro" >> "$GITHUB_OUTPUT"

      - name: Check that the release doesn't exist yet
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" > /dev/null; then
            echo "::error::The tag ${{ steps.version.outputs.tag }} already exists. Raise the version in the Makefile first."
            exit 1
          fi

      # Everything between "### v1.04" and the next "### " line, without
      # the blank lines at the start and the end. The text itself is not changed.
      - name: Copy the release notes from CHANGELOG.md
        run: |
          awk -v heading="### ${{ steps.version.outputs.heading }}" '
            { sub(/\r$/, "") }
            $0 == heading { found = 1; next }
            found && /^### / { exit }
            found && !started && $0 == "" { next }
            found { started = 1; print }
          ' CHANGELOG.md | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md has no '### ${{ steps.version.outputs.heading }}' section, or it is empty."
            exit 1
          fi
          cat release_notes.md

      - name: Build
        run: tools/build.sh

      - name: Check the build
        run: ls -l virtuanes_3ds.3dsx virtuanes_3ds.smdh virtuanes_3ds.cia

      - name: Publish the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          args=()
          if [ "$DRAFT" = "true" ]; then
            args+=(--draft)
          fi
          gh release create "$TAG" \
            virtuanes_3ds.3dsx virtuanes_3ds.smdh virtuanes_3ds.cia \
            --title "VirtuaNES for 3DS $TAG" \
            --notes-file release_notes.md \
            --target "$GITHUB_SHA" \
            "${args[@]}"
